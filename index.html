<!doctype html>
<html>
<head>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="theme-color" content="#43105b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LMS">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Man Standing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
<header class="hero">
<div>
<div class="eyebrow">PRIVATE COMPETITION</div>
<h1>Last Man Standing</h1>
<p id="summary">Choose a sport</p>
<div class="heroMeta">
<p id="deadlineClock" class="deadlineClock" hidden></p>
<button id="changeSport" class="changeSport" type="button">Change sport</button>
<button id="shareCompBtn" class="changeSport" type="button">🔗 Share</button>
<button id="installAppBtn" class="changeSport" type="button">📲 Install App</button>
</div>
</div>
<div class="ball"><img id="sportMark" src="/EPL.jpg" alt="Football"></div>
</header>
<nav class="tabs">
<button data-tab="home" class="active" type="button">Home</button>
<button data-tab="pick" type="button" hidden>Make Pick</button>
<button data-tab="fixtures" type="button">Fixtures</button>
<button data-tab="players" type="button">Players</button>
</nav>
<div id="toastStack" aria-live="polite"></div>
<section id="content"></section>
<footer>Last Man Standing · Private competition</footer>
</main>
<script src="app.js"></script>
</body>
</html>
